stages: [build]

image: docker:20.10

services:
  - name: docker:20.10-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test/production"'
      when: always
    - when: never

.before_docker_login:
  before_script:
    - set -euo pipefail
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - nc -vz docker 2375 || true
    - nc -vz docker 2376 || true
    - docker version
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY_HOSTNAME" -u "$CI_REGISTRY_USERNAME" --password-stdin
    # tag fallback: tag pipeline => CI_COMMIT_TAG, branch pipeline => short SHA
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "IMAGE_TAG=$IMAGE_TAG"
    - export ENV_TAG="latest"

build_backend_api:
  stage: build
  extends: .before_docker_login
  script:
    - set -euo pipefail
    - cd backend
    - PROJECT_NAME="$(echo "$CI_PROJECT_NAME" | sed -e 's/-api//g')"

    - WORKER_IMAGE="$CI_REGISTRY_HOSTNAME/gitlab-ci-build/${PROJECT_NAME}-worker:${IMAGE_TAG}"
    - API_IMAGE="$CI_REGISTRY_HOSTNAME/gitlab-ci-build/${PROJECT_NAME}-api:${IMAGE_TAG}"

    - echo "WORKER_IMAGE=$WORKER_IMAGE"
    - echo "API_IMAGE=$API_IMAGE"

    - docker build -f Dockerfile.multistage --target worker -t "$WORKER_IMAGE" .
    - docker push "$WORKER_IMAGE"

    - docker build -f Dockerfile.multistage --target api -t "$API_IMAGE" .
    - docker push "$API_IMAGE"

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "test/production" ]; then
        WORKER_LATEST="$CI_REGISTRY_HOSTNAME/gitlab-ci-build/${PROJECT_NAME}-worker:latest"
        API_LATEST="$CI_REGISTRY_HOSTNAME/gitlab-ci-build/${PROJECT_NAME}-api:latest"

        docker tag "$WORKER_IMAGE" "$WORKER_LATEST"
        docker push "$WORKER_LATEST"

        docker tag "$API_IMAGE" "$API_LATEST"
        docker push "$API_LATEST"
      fi

  rules:
    - changes: [backend/**/*]


build_backend_worker:
  stage: build
  extends: .before_docker_login
  script:
    - cd backend
    - docker build -f Dockerfile.multistage --target worker -t "$CI_REGISTRY_IMAGE/backend-worker:${SHA_TAG}" -t "$CI_REGISTRY_IMAGE/backend-worker:${ENV_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:${SHA_TAG}"
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:${ENV_TAG}"
  rules:
    - changes: [backend/**/*]

build_frontend:
  stage: build
  extends: .before_docker_login
  script:
    - cd frontend
    - docker build -f Dockerfile --build-arg VITE_API_BASE="${VITE_API_BASE}" -t "$CI_REGISTRY_IMAGE/frontend:${SHA_TAG}" -t "$CI_REGISTRY_IMAGE/frontend:${ENV_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:${SHA_TAG}"
    - docker push "$CI_REGISTRY_IMAGE/frontend:${ENV_TAG}"
  rules:
    - changes: [frontend/**/*]
