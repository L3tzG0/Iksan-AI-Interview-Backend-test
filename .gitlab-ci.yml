stages: [build]

image: docker:20.10

services:
  - name: docker:20.10-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test/production"
    - when: never

.before_docker_login:
  before_script:
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - nc -vz docker 2375 || true
    - nc -vz docker 2376 || true
    - docker version
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY_HOSTNAME" -u "$CI_REGISTRY_USERNAME" --password-stdin
    - export SHA_TAG="${CI_COMMIT_SHORT_SHA}"
    - export ENV_TAG="latest"

build_backend_api:
  stage: build
  extends: .before_docker_login
  script:
    - cd backend
    - PROJECT_NAME=$(echo $CI_PROJECT_NAME | sed -e "s/-api//g")
    - DOCKER_WORKER_IMAGE_NAME=$CI_REGISTRY_HOSTNAME/gitlab-ci-build/$PROJECT_NAME-worker:$CI_COMMIT_TAG
    - echo $DOCKER_WORKER_IMAGE_NAME
    - DOCKER_API_IMAGE_NAME=$CI_REGISTRY_HOSTNAME/gitlab-ci-build/$PROJECT_NAME-api:$CI_COMMIT_TAG
    - echo $DOCKER_API_IMAGE_NAME
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY_HOSTNAME -u $CI_REGISTRY_USERNAME --password-stdin
    - docker build -t $DOCKER_WORKER_IMAGE_NAME -f Dockerfile.multistage --target worker .
    - docker push $DOCKER_WORKER_IMAGE_NAME
    - docker build -t $DOCKER_API_IMAGE_NAME -f Dockerfile.multistage --target api .
    - docker push $DOCKER_API_IMAGE_NAME    
  rules:
    - changes: [backend/**/*]

build_backend_worker:
  stage: build
  extends: .before_docker_login
  script:
    - cd backend
    - docker build -f Dockerfile.multistage --target worker -t "$CI_REGISTRY_IMAGE/backend-worker:${SHA_TAG}" -t "$CI_REGISTRY_IMAGE/backend-worker:${ENV_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:${SHA_TAG}"
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:${ENV_TAG}"
  rules:
    - changes: [backend/**/*]

build_frontend:
  stage: build
  extends: .before_docker_login
  script:
    - cd frontend
    - docker build -f Dockerfile --build-arg VITE_API_BASE="${VITE_API_BASE}" -t "$CI_REGISTRY_IMAGE/frontend:${SHA_TAG}" -t "$CI_REGISTRY_IMAGE/frontend:${ENV_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:${SHA_TAG}"
    - docker push "$CI_REGISTRY_IMAGE/frontend:${ENV_TAG}"
  rules:
    - changes: [frontend/**/*]
