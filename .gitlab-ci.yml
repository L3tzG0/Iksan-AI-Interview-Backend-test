stages: [build]

image: docker:20.10

services:
  - name: docker:20.10-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test/production"'
      when: always
    - when: never

.before_docker_login:
  before_script:
    - set -euo pipefail
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - nc -vz docker 2375 || true
    - nc -vz docker 2376 || true
    - docker version
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY_HOSTNAME" -u "$CI_REGISTRY_USERNAME" --password-stdin

    # Immutable tag for every pipeline (tag name if exists, otherwise short SHA)
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "IMAGE_TAG=$IMAGE_TAG"

    # Only push :latest on main / test/production
    - export PUSH_LATEST="false"
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ] || [ "${CI_COMMIT_BRANCH:-}" = "test/production" ]; then
        PUSH_LATEST="true"
      fi
    - echo "PUSH_LATEST=$PUSH_LATEST"

    # Your image namespace (keep consistent across all 3 images)
    - export PROJECT_NAME="$(echo "$CI_PROJECT_NAME" | sed -e 's/-api//g')"
    - export REGISTRY_PATH="$CI_REGISTRY_HOSTNAME/gitlab-ci-build"
    - echo "PROJECT_NAME=$PROJECT_NAME"
    - echo "REGISTRY_PATH=$REGISTRY_PATH"

build_backend:
  stage: build
  extends: .before_docker_login
  rules:
    - changes:
        - backend/**/*
  script:
    - set -euo pipefail
    - cd backend

    - WORKER_IMAGE="$REGISTRY_PATH/${PROJECT_NAME}-worker:${IMAGE_TAG}"
    - API_IMAGE="$REGISTRY_PATH/${PROJECT_NAME}-api:${IMAGE_TAG}"

    - echo "WORKER_IMAGE=$WORKER_IMAGE"
    - echo "API_IMAGE=$API_IMAGE"

    - docker build -f Dockerfile.multistage --target worker -t "$WORKER_IMAGE" .
    - docker push "$WORKER_IMAGE"

    - docker build -f Dockerfile.multistage --target api -t "$API_IMAGE" .
    - docker push "$API_IMAGE"

    - |
      if [ "$PUSH_LATEST" = "true" ]; then
        WORKER_LATEST="$REGISTRY_PATH/${PROJECT_NAME}-worker:latest"
        API_LATEST="$REGISTRY_PATH/${PROJECT_NAME}-api:latest"

        docker tag "$WORKER_IMAGE" "$WORKER_LATEST"
        docker push "$WORKER_LATEST"

        docker tag "$API_IMAGE" "$API_LATEST"
        docker push "$API_LATEST"
      fi

build_frontend:
  stage: build
  extends: .before_docker_login
  rules:
    - changes:
        - frontend/**/*
  script:
    - set -euo pipefail
    - cd frontend

    - FRONTEND_IMAGE="$REGISTRY_PATH/${PROJECT_NAME}-frontend:${IMAGE_TAG}"
    - echo "FRONTEND_IMAGE=$FRONTEND_IMAGE"

    - docker build -f Dockerfile --build-arg VITE_API_BASE="${VITE_API_BASE:-}" -t "$FRONTEND_IMAGE" .
    - docker push "$FRONTEND_IMAGE"

    - |
      if [ "$PUSH_LATEST" = "true" ]; then
        FRONTEND_LATEST="$REGISTRY_PATH/${PROJECT_NAME}-frontend:latest"
        docker tag "$FRONTEND_IMAGE" "$FRONTEND_LATEST"
        docker push "$FRONTEND_LATEST"
      fi
