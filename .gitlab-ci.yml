stages: [build]

image: docker:20.10

services:
  - name: docker:20.10-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test/production"
    - when: never

.before_docker_login:
  before_script:
    - apk add --no-cache curl bind-tools netcat-openbsd
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - nc -vz docker 2376 || true
    - i=0; until docker info >/dev/null 2>&1; do i=$((i+1)); [ $i -gt 30 ] && echo "Docker daemon not ready" && exit 1; sleep 1; done
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY_HOSTNAME" -u "$CI_REGISTRY_USERNAME" --password-stdin

build_backend_images:
  stage: build
  extends: .before_docker_login
  script:
    - cd backend
    - docker build -f Dockerfile.multistage --target api -t "$CI_REGISTRY_IMAGE/backend-api:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/backend-api:latest" .
    - docker push "$CI_REGISTRY_IMAGE/backend-api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend-api:latest"
    - docker build -f Dockerfile.multistage --target worker -t "$CI_REGISTRY_IMAGE/backend-worker:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/backend-worker:latest" .
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend-worker:latest"
  only:
    changes:
      - backend/**/*

build_frontend_image:
  stage: build
  extends: .before_docker_login
  script:
    - cd frontend
    - docker build -f Dockerfile --build-arg VITE_API_BASE="${VITE_API_BASE}" -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  only:
    changes:
      - frontend/**/*
