stages:
  - build

image: docker:20.10

services:
  - name: docker:20.10-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: /certs

  # Image tags
  BACKEND_API_IMAGE: "$CI_REGISTRY_IMAGE/backend-api"
  BACKEND_WORKER_IMAGE: "$CI_REGISTRY_IMAGE/backend-worker"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test/production"
    - when: never

.before_docker_login:
  before_script:
    # Install debug tools (docker image is alpine)
    - apk add --no-cache curl bind-tools netcat-openbsd

    # Sanity: show docker info
    - docker info

    # Login to GitLab Container Registry (default 443)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY_HOSTNAME" -u "$CI_REGISTRY_USERNAME" --password-stdin

    # --- DEBUG: registry connectivity ---
    - echo "=== DNS check ==="
    - getent hosts "$CI_REGISTRY_HOSTNAME" || nslookup "$CI_REGISTRY_HOSTNAME" || true

    - echo "=== TCP reachability (443) ==="
    - nc -vz "$CI_REGISTRY_HOSTNAME" 443 || true

    - echo "=== HTTPS /v2/ check ==="
    # Expect 401 Unauthorized if reachable (that's GOOD for registry)
    - curl -vk --connect-timeout 5 "https://$CI_REGISTRY_HOSTNAME/v2/" || true
    # --- END DEBUG ---

build_backend_images:
  stage: build
  extends: .before_docker_login
  script:
    - cd backend

    - docker build -f Dockerfile.multistage --target api \
        -t "$BACKEND_API_IMAGE:$CI_COMMIT_SHA" \
        -t "$BACKEND_API_IMAGE:latest" .

    - docker push "$BACKEND_API_IMAGE:$CI_COMMIT_SHA"
    - docker push "$BACKEND_API_IMAGE:latest"

    - docker build -f Dockerfile.multistage --target worker \
        -t "$BACKEND_WORKER_IMAGE:$CI_COMMIT_SHA" \
        -t "$BACKEND_WORKER_IMAGE:latest" .

    - docker push "$BACKEND_WORKER_IMAGE:$CI_COMMIT_SHA"
    - docker push "$BACKEND_WORKER_IMAGE:latest"
  only:
    changes:
      - backend/**/*

build_frontend_image:
  stage: build
  extends: .before_docker_login
  script:
    - cd frontend

    - docker build -f Dockerfile \
        --build-arg VITE_API_BASE="${VITE_API_BASE}" \
        --build-arg VITE_SENTRY_DSN="${VITE_SENTRY_DSN}" \
        --build-arg VITE_ENVIRONMENT="${VITE_ENVIRONMENT:-production}" \
        -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA" \
        -t "$FRONTEND_IMAGE:latest" .

    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  only:
    changes:
      - frontend/**/*
